{{- $p := .Site.Params -}}
<div class="legal-block">
  <strong>{{ $p.legalName }}</strong>
  <span>{{ $p.legalAddr1 }}</span>
  <span>{{ $p.legalAddr2 }}</span>
  <a href="mailto:{{ $p.email }}">{{ $p.email }}</a>
</div>
{{- with $p.legalVatId }}
<p>{{ i18n "legal_vat_label" }}: {{ . }}</p>
{{- end }}
