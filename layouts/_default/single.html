{{ define "main" }}
<article class="page">
  <div class="wrap wrap-narrow">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.updated }}<p class="page-meta">{{ i18n "updated" }}: {{ . }}</p>{{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
