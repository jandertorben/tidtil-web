<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $revealJS := resources.Get "js/reveal.js" | resources.Minify | resources.Fingerprint }}
    <script src="{{ $revealJS.RelPermalink }}" defer></script>
  </body>
</html>
