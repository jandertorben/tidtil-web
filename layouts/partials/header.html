<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ "/" | relLangURL }}">
      <span class="wordmark-tid">Tid</span><span class="wordmark-til">Til</span>
    </a>

    <nav class="site-nav" aria-label="{{ i18n "nav_label" }}">
      <a href="{{ "/" | relLangURL }}#features">{{ i18n "nav_features" }}</a>
      <a href="{{ (.Site.GetPage "privacy").RelPermalink }}">{{ i18n "nav_privacy" }}</a>
      <a href="{{ (.Site.GetPage "support").RelPermalink }}">{{ i18n "nav_support" }}</a>

      {{ if .IsTranslated }}
      <span class="lang-switch" aria-label="{{ i18n "lang_label" }}">
        <a class="lang current" aria-current="page">{{ .Site.Language.Lang | upper }}</a>
        {{ range .Translations }}
        <a class="lang" href="{{ .Permalink }}" hreflang="{{ .Language.Lang }}">{{ .Language.Lang | upper }}</a>
        {{ end }}
      </span>
      {{ end }}
    </nav>
  </div>
</header>
