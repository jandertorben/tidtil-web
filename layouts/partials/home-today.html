{{ $p := .Params }}
{{ $today := index $p.rows 0 }}

<section class="today-section" aria-labelledby="today-title">
  <div class="wrap today-layout">
    <div class="today-copy">
      <p class="kicker">{{ $today.kicker }}</p>
      <h2 id="today-title" class="today-title">{{ $today.title }}</h2>
      <p class="today-text">{{ $today.text }}</p>

      {{ with $p.core_benefits }}
      <div class="today-benefits">
        {{ range . }}
        <article class="today-benefit">
          <div class="today-benefit-icon" aria-hidden="true">{{ .icon }}</div>
          <div>
            <h3>{{ .title }}</h3>
            <p>{{ .text }}</p>
          </div>
        </article>
        {{ end }}
      </div>
      {{ end }}
    </div>

    <figure class="today-visual">
      <img class="today-lifestyle-image" src="{{ "img/tidtil-heute-lifestyle.webp" | relURL }}" alt="{{ $today.alt }}" width="1107" height="1226" loading="lazy" decoding="async">
    </figure>
  </div>
</section>
