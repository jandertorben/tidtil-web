<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <span class="brand"><img src="{{ "img/tidtil-icon-light.png" | relURL }}" alt="" width="28" height="28" loading="lazy">TidTil</span>
      <span class="footer-made">{{ i18n "footer_made" }}</span>
    </div>
    <nav class="footer-nav" aria-label="{{ i18n "nav_family_calendar" }}">
      <a href="{{ (.Site.GetPage "familienkalender-iphone").RelPermalink }}">{{ i18n "nav_family_calendar" }}</a>
      <a href="{{ (.Site.GetPage "familienkalender-ohne-werbung").RelPermalink }}">{{ i18n "nav_no_ads" }}</a>
      <a href="{{ (.Site.GetPage "familienkalender-kinder-ohne-handy").RelPermalink }}">{{ i18n "nav_kids" }}</a>
    </nav>
    <nav class="footer-nav" aria-label="{{ i18n "nav_label" }}">
      <a href="{{ (.Site.GetPage "privacy").RelPermalink }}">{{ i18n "nav_privacy" }}</a>
      <a href="{{ (.Site.GetPage "support").RelPermalink }}">{{ i18n "nav_support" }}</a>
      <a href="{{ (.Site.GetPage "impressum").RelPermalink }}">{{ i18n "nav_impressum" }}</a>
      <a href="mailto:{{ .Site.Params.email }}">{{ i18n "nav_contact" }}</a>
    </nav>
  </div>
  <div class="wrap footer-copy">© {{ now.Year }} TidTil</div>
</footer>
