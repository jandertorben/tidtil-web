# TidTil – Website (Hugo)
baseURL = "https://tidtil.app/"
title = "TidTil"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

enableEmoji = true
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
  [languages.da]
    label = "Dansk"
    locale = "da-DK"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[params]
  email = "torbenjander@icloud.com"
  appStoreURL = "https://apps.apple.com/us/app/tidtil/id6780019857"
  ogImage = "img/tidtil-social-preview.jpg"

  legalName  = "Torben Jander"
  legalAddr1 = "Arster Landstraße 22"
  legalAddr2 = "28279 Bremen"
  legalVatId = ""
