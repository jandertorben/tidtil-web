# TidTil – Website (Hugo)
baseURL = "https://tidtil.app/"
title = "TidTil"

# Mehrsprachig: Deutsch ist Standard (ohne URL-Präfix), en/da bekommen /en/ bzw. /da/.
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

# Übersetzungen werden über den Dateinamen zugeordnet (_index.de.md, _index.en.md …).
enableEmoji = true
enableRobotsTXT = true

# Es gibt keine Tags/Kategorien – die Taxonomie-Templates spart das.
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
  [languages.da]
    label = "Dansk"
    locale = "da-DK"
    weight = 3

[markup.goldmark.renderer]
  # Erlaubt gezieltes HTML in den Rechtstexten (z. B. Links, Hervorhebungen).
  unsafe = true

[params]
  # Kontakt-Adresse für Support & Datenschutz.
  email = "torbenjander@icloud.com"
  appStoreURL = "https://apps.apple.com/us/app/tidtil/id6780019857"
  ogImage = "img/6D558C1C-D51B-4FCA-91BE-E40C717ED879.png"

  # Impressum-Angaben (§ 5 DDG). Erscheinen ausschließlich auf der Impressum-Seite.
  legalName  = "Torben Jander"
  legalAddr1 = "Arster Landstraße 22"
  legalAddr2 = "28279 Bremen"
  legalVatId = ""   # USt-IdNr., falls vorhanden (sonst leer lassen)
