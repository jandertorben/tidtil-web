# TidTil – Website (Hugo)
baseURL = "https://tidtil.app/"
title = "TidTil"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

enableEmoji = true
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
  [languages.da]
    label = "Dansk"
    locale = "da-DK"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[params]
  email = "hallo@tidtil.app"
  emailSupport = "support@tidtil.app"
   # Ohne Ländercode: Apple leitet automatisch in den Store des Besuchers.
  appStoreURL = "https://apps.apple.com/app/id6780019857"
  # Apple Smart App Banner. Nur die numerische App-Store-ID.
  appStoreID = "6780019857"
  ogImage = "img/AB14F977-D8D0-4346-BADC-8E84A292D4FC.png"

  instagramURL = "https://www.instagram.com/tidtil.app/"
  tiktokURL = "https://www.tiktok.com/@tidtil.app"
  threadsURL = "https://www.threads.com/@tidtil.app"
  pinterestURL = "https://www.pinterest.com/tidtilapp/"
  # Pinterest-Domain-Verifizierung. Wird als <meta name="p:domain_verify"> im Head ausgegeben.
  pinterestDomainVerify = "e0b989d59270936063a4d7c8dffefad0"

  legalName  = "Torben Jander"
  legalAddr1 = "Arster Landstraße 22"
  legalAddr2 = "28279 Bremen"
  legalVatId = ""
