# TidTil – Website (Hugo)
# GitHub-Pages-Projektseite: Basis-URL enthält den Repo-Pfad.
baseURL = "https://jandertorben.github.io/tidtil-web/"
title = "TidTil"

# Mehrsprachig: Deutsch ist Standard (ohne URL-Präfix), en/da bekommen /en/ bzw. /da/.
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

# Übersetzungen werden über den Dateinamen zugeordnet (_index.de.md, _index.en.md …).
enableEmoji = true

# Es gibt keine Tags/Kategorien – die Taxonomie-Templates spart das.
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
  [languages.da]
    label = "Dansk"
    locale = "da"
    weight = 3

[markup.goldmark.renderer]
  # Erlaubt gezieltes HTML in den Rechtstexten (z. B. Links, Hervorhebungen).
  unsafe = true

[params]
  # Kontakt-Adresse für Support & Datenschutz.
  email = "torbenjander@icloud.com"
  appStoreURL = ""   # sobald die App live ist, hier den App-Store-Link eintragen

  # Impressum-Angaben (§ 5 DDG). PLATZHALTER — vor dem Verkauf/Abo durch echte
  # Daten ersetzen. Erscheinen ausschließlich auf der Impressum-Seite.
  legalName  = "[Vor- und Nachname]"
  legalAddr1 = "[Straße und Hausnummer]"
  legalAddr2 = "[PLZ und Ort]"
  legalPhone = "[Telefonnummer]"
  legalVatId = ""   # USt-IdNr., falls vorhanden (sonst leer lassen)
